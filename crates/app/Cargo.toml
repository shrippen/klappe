[package]
name = "klappe-app"
description = "Klappe desktop app: Qt Quick with Kirigami and Kante, bridged to Rust with cxx-qt."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "klappe"
path = "src/main.rs"

[dependencies]
klappe-services.workspace = true
serde.workspace = true
serde_json.workspace = true
# Qt bridge (MIT/Apache-2.0); Qt itself is linked dynamically (LGPL).
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10"

[lints]
workspace = true

# Crew places (LH-117): where a person of the crew stands or sits. The boom operator's place is
# the person with the pole held up (the pole reaches 2.5 m); the director's chair is the high
# one.
[[objekt]]
kind = "boom"
group = "crew"
width_m = 0.6
depth_m = 0.6
shape = "ellipse"
height_m = 2.5

[[objekt]]
kind = "monitor"
form = "monitor"
group = "crew"
width_m = 2.0
depth_m = 0.8
height_m = 1.3

[[objekt]]
kind = "director"
form = "chair"
group = "crew"
width_m = 0.6
depth_m = 0.6
height_m = 1.1


# The built-in object library (LH-11). Sizes in metres at rotation 0; what has a front or a
# long side (car, carriage, horse, stairs) lies along x and faces right (0 degrees). `height_m`
# is optional (LH-17): a flat object has none. The names
# are in the catalogue (`objectKind.<kind>`); an own object brings its `label` instead.


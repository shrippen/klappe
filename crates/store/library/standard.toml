# Camera support (LH-35). A track is 4 m long at the standard gauge (0.62 m); a jib and a crane
# take the circle their arm sweeps (diameter = twice the arm: 3 m and 6 m).
[[objekt]]
kind = "track"
group = "camera"
width_m = 4.0
depth_m = 0.62
height_m = 0.15

[[objekt]]
kind = "dolly"
group = "camera"
width_m = 1.2
depth_m = 0.8
height_m = 0.9


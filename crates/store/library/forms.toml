to = [1, 0.1, 1]

[[form.box]]
from = [0, 0, 0]
to = [0.1, 0.1, 0.47]

[[form.box]]
from = [0, 0.9, 0]
to = [0.1, 1, 0.47]

[[form.box]]
from = [0.9, 0, 0]
to = [1, 0.1, 0.47]

[[form.box]]
from = [0.9, 0.9, 0]
to = [1, 1, 0.47]


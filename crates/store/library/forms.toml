# The built-in body forms (LH-97): how a library entry looks in 3D. Boxes in fractions of the
# object: x along its width, y along its depth (from the unrotated top left corner), z from its
# underside to its top. A library entry names a form by `form = "<name>"`; an entry without
# one stays a plain prism. A new form is data: add it here and name it.

# Top and four legs.
[[form]]
name = "table"

[[form.box]]
from = [0, 0, 0.92]
to = [1, 1, 1]

[[form.box]]
from = [0, 0, 0]
to = [0.04, 0.07, 0.92]

[[form.box]]
from = [0, 0.93, 0]
to = [0.04, 1, 0.92]

[[form.box]]
from = [0.96, 0, 0]
to = [1, 0.07, 0.92]

[[form.box]]
from = [0.96, 0.93, 0]
to = [1, 1, 0.92]


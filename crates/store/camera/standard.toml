# The built-in camera presets (LH-32). A body is a sensor format: its active width in
# millimetres and the frame it is usually shot in. Formats only, no makes: the width of one
# make differs from the next. A lens set is named in the catalogue (`lensSet.<id>`); a prime
# set lists its focal lengths in millimetres, a zoom its shortest and longest.


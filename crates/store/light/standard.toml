# The built-in lamps (LH-51). Each entry is what a new lamp starts with: its kind, power in
# watts, colour temperature in kelvin and beam angle in degrees. A lamp is named in the
# catalogue (`lightPreset.<id>`). The colour temperature of an LED lamp can be changed on its
# card; a tungsten lamp keeps its own. Bounce and flag make no light of their own: power 0.

[[lampe]]
id = "fresnel-650"
kind = "fresnel"
power_w = 650.0
color_temp_k = 3200.0
beam_deg = 30.0


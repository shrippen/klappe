[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://git.arianw.de/shrippen/klappe"
publish = false

[workspace.dependencies]
klappe-model = { path = "crates/model" }
klappe-stellprobe = { path = "crates/stellprobe" }
klappe-services = { path = "crates/services" }
klappe-export = { path = "crates/export" }
klappe-script = { path = "crates/script" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
klappe-store = { path = "crates/store" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = 1
